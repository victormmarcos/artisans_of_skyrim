[items]
# Items named in a patch ([[items.tiers]] form, or allow) skip the mod's own
# exclusions: unique items, conversion recipes, unknown materials, items enchanted
# by default, Ancient Nord weapons and defaultBlock below. Safety rules (value,
# playable, category, quest items) and lore gates (Baldor, Gunmar, Eorlund...)
# still apply. block always wins, even over a named item.
allow = []
block = []
# The mod's own blocks; a patch that names one of these items offers it anyway.
defaultBlock = [
    "Dawnguard.esm|0001668C", # Dawnguard Rune Axe
    "Dawnguard.esm|00011BAD", # Dawnguard Rune Hammer
    "Dawnguard.esm|00011BAF", # Dawnguard Rune Shield
]
special = []
# Blacksmith tier for an item or a material keyword. The log lists skipped items
# as lines ready to copy, e.g.:
#   [[items.tiers]]
#   form = "Plugin.esp|000800"            # one item: also named (see above)
#   tier = "Expert"
#   price = 2500                          # needed without a forge recipe or at value 0
#   count = 24                            # arrows/bolts without a forge recipe
#   [[items.tiers]]
#   keyword = "ArmorMaterialThievesGuild"  # every item with this keyword
#   tier = "Adept"
# A keyword only sets the tier; it does not name the items.
artifactKeywordTokens = ["daedricartifact", "weaptypeartifact", "artifact"]
specialItemTokens = ["unique", "artifact"]

