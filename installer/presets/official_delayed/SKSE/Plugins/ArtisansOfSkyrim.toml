# Artisans of Skyrim unified runtime configuration
# Final targets: ArtisansOfSkyrim.esp and ArtisansOfSkyrim.dll.
# Legacy standalone Smithing/Enchanting plugins are reference-only historical inputs.
# Alchemy itemForm values point at generated ALCH records in ArtisansOfSkyrim.esp.

[mod]
name = "Artisans of Skyrim"
plugin = "ArtisansOfSkyrim.esp"
dll = "ArtisansOfSkyrim.dll"
editorIdPrefix = "AOS_"
globalDiscountCap = 0.2
alchemyBatchSize = 5

[services]
# false removes that service completely: no dialogue option, no menu.
smithing = true
enchanting = true
alchemy = true

[features]
# Each custom option is a separate installer checkbox. A checked box installs
# ArtisansOfSkyrim_<Option>.toml, which turns its key on. Items created with an
# option that is later turned off keep working and stay protected from
# disenchanting; vanilla Wolf Armor support is always available.
enableSkyforgeEquipment = false   # Eorlund's custom Skyforge Steel equipment
enableCustomEnchantments = false  # six custom enchantments
enableCustomPotions = false       # Health, Magicka and Stamina Over Time potions

[ui]
enableHotkey = false
interactionScanCode = 68
pageSize = 3

# =============================================================================
# PRICES
# Everything a player usually wants to change is in this block.
# All prices are in gold, before the Speech / Fortify Barter / Haggling discount.
#
# Tip: copy only the lines you change into ArtisansOfSkyrim_Custom.toml (same
# [section] names). Mod updates never overwrite that file.
#
# Per-item prices are further below in this file:
#   Enchanting: adeptPrice / expertPrice / masterPrice in each [[enchantments]]
#   Alchemy:    batchPrice (price of the whole batch) in each [[alchemy.items]]
# =============================================================================

# --- Smithing: crafting ------------------------------------------------------
# Price = fee for the item size + item value x craftMultiplier
# The fee is the work, the multiplier the material. Both always count.
#   Small  = daggers
#   Medium = one-handed weapons, bows, shields, light armor and armor pieces
#   Large  = two-handed weapons, crossbows and heavy body armor
[pricing.crafting]
craftMultiplier = 1.25
smallServiceFee = 400.0
mediumServiceFee = 700.0
largeServiceFee = 1000.0
# Arrows and bolts without a fixed batch price. Vanilla ammunition batches
# (24 arrows / 10 bolts) have fixed prices and ignore this fee.
ammunitionServiceFee = 200.0

# --- Smithing: improvement ---------------------------------------------------
# Price = fee for the quality and item size + item value x valueMultiplier
# The fee is the work, the multiplier the material. Both always count.
# Works for mod-added items too: only the gold value and item size are used.
[pricing.improvement]
valueMultiplier = 0.2

# Fee per quality and item size (Small / Medium / Large as in crafting).
[pricing.improvementFees]
fineSmall = 200.0
fineMedium = 250.0
fineLarge = 300.0

superiorSmall = 300.0
superiorMedium = 350.0
superiorLarge = 400.0

exquisiteSmall = 400.0
exquisiteMedium = 450.0
exquisiteLarge = 500.0

flawlessSmall = 500.0
flawlessMedium = 750.0
flawlessLarge = 1000.0

epicSmall = 1000.0
epicMedium = 1250.0
epicLarge = 1500.0

legendarySmall = 1500.0
legendaryMedium = 2000.0
legendaryLarge = 2500.0

# --- Smithing: quality results (not prices) ----------------------------------
# Damage or armor multiplier an item receives at each quality.
# Each value stays inside its quality's range (Fine 1.10-1.19, ... Epic 1.50-1.59);
# Legendary can go from 1.60 upwards.
[tempering.targets]
fine = 1.19
superior = 1.29
exquisite = 1.39
flawless = 1.49
epic = 1.59
legendary = 2.0

# --- Enchanting --------------------------------------------------------------
[pricing]
# Added once per effect (twice for a dual enchantment).
grandSoulServiceCost = 1000
# Charge a new weapon enchantment receives. Not a price.
grandSoulWeaponCharge = 3000

# --- Discount -----------------------------------------------------------------
# Applies to every service. The total discount never exceeds maxDiscount
# (and never more than 0.2 = 20%).
[pricing.barter]
enabled = true
maxDiscount = 0.2
# Speech skill: discountPerPoint for each Speech point above speechBaseline.
includeSpeechSkill = true
speechBaseline = 15.0
speechSkillDiscountPerPoint = 0.0025
# Fortify Barter / Fortify Speech effects count as a percentage discount.
includeSpeechcraftModifiers = true
# Haggling perk ranks: 10% / 15% / 20% / 25% / 30% (highest owned rank only).
includeHagglingPerks = true

# =============================================================================
# END OF PRICES
# =============================================================================

[rules]
defaultSmithTier = "Adept"
# Blacksmiths from other mods (still need the blacksmith faction): Adept, Expert or Master.
modAddedSmithTier = "Adept"
includeModAddedEquipment = false
requireBlacksmithFaction = true
requireTemperingRecipe = true
allowRecognizedKeywordFallback = true
allowUnknownMaterialFallbackForExpertOrMaster = true
uniqueItemsRequireMaster = true
# Unique/quest items: those with an artifact keyword, MagicDisallowEnchanting or
# an [items].special entry, and items that no leveled list or NPC outfit uses and
# no regular forge recipe creates. Improving them requires a Master.
# The two rules below only filter forge recipes added by other mods.
excludeConversionRecipes = true
excludeUniqueCrafting = true
artifactsRequireMaster = true
allowEnchantedItems = true
enchantedItemsRequireExpert = true
